[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "squat-tracker"
version = "0.1.0"
description = "Per-rep squat depth, bar speed and torso metrics from a side-view video"
requires-python = ">=3.10"
dependencies = ["mediapipe>=0.10.14", "opencv-python>=4.8", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
squat-track = "squat_tracker.cli:main"

[tool.setuptools]
packages = ["squat_tracker"]
